openapi: 3.0.4
info:
  title: API Кинотеатра - OpenAPI 3.0
  description: |
    API кинотеатра для сайта
  version: 1.0.0
servers:
  - url: https://virtserver.swaggerhub.com/student-22f-f0c/MovieTicketBooking/1.0.0
paths:
  /seances:
    get:
      tags:
        - Seances
      summary: Получить информацию обо всех сеансах
      security:
        - adminAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Номер страницы
          schema:
            type: integer
            default: 1
            minimum: 1 
        - name: limit
          in: query
          required: false
          description: Количество записей на странице
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/seancesResponse'
                  - $ref: '#/components/schemas/seancesAdmin'
            application/xml:
              schema:
                xml:
                  name: seances
                anyOf:
                  - $ref: '#/components/schemas/seancesResponse'
                  - $ref: '#/components/schemas/seancesAdmin'
        '400':
          description: Неверный формат запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Сеансы не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Seances
      summary: Создать сеанс
      security: 
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/seance'
              - type: object
                properties:
                  userId:
                    description: Уникальный идентификатор пользователя
                    type: integer
                    example: 25
                required:
                  - movie
                  - startDate
                  - startTime
                  - endDateTime
                  - auditoriumId
                  - userId
          application/xml:
            schema:
              xml:
                name: seanceSearch
              allOf:
              - $ref: '#/components/schemas/seance'
              - type: object
                properties:
                  userId:
                    description: Уникальный идентификатор пользователя
                    type: integer
                    example: 25
                required:
                  - movie
                  - startDate
                  - startTime
                  - endDateTime
                  - auditoriumId
                  - userId
      responses:
        '201':
          description: Сеанс успешно создан
          content:
            application/json:
              schema:
                type: object
                required:
                  - seanceId
                  - movieId
                  - startDate
                  - startTime
                  - endDateTime
                  - auditoriumId
                properties:
                  seanceId:
                    description: Идентификатор сеанса
                    type: integer
                    example: 1234672354
                  movieId:
                    description: Идентификатор фильма
                    type: integer
                    example: 32167453
                  startDate:
                    description: Дата начала сеанса
                    type: string
                    example: "2026-11-01"
                  startTime:
                    description: Время начала сеанса
                    type: string
                    example: "18:30"
                  endDateTime:
                    description: Дата и время окончания сеанса.
                    type: string
                    example: "21:19"
                  auditoriumId:
                    description: Уникальный идентификатор зала.
                    type: integer
                    example: 12361235
            application/xml:
              schema:
                xml:
                  name: seance
                type: object
                required:
                  - seanceId
                  - movieId
                  - startDate
                  - startTime
                  - endDateTime
                  - auditoriumId
                properties:
                  seanceId:
                    description: Идентификатор сеанса
                    type: integer
                    example: 1234672354
                  movieId:
                    description: Идентификатор фильма
                    type: integer
                    example: 32167453
                  startDate:
                    description: Дата начала сеанса
                    type: string
                    example: "2026-11-01"
                  startTime:
                    description: Время начала сеанса
                    type: string
                    example: "18:30"
                  endDateTime:
                    description: Дата и время окончания сеанса.
                    type: string
                    example: "21:19"
                  auditoriumId:
                    description: Уникальный идентификатор зала.
                    type: integer
                    example: 12361235
        '400':
          description: Неверный формат запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Сеанс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт - зал занят в указанное время
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /seances/{seanceId}:
    patch:
      tags:
        - Seances
      summary: Изменить существующий сеанс.
      security: 
        - adminAuth: []
      parameters:
        - name: seanceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/seanceUpdate'
              - type: object
                properties:
                  userId:
                    type: integer
                    description: Идентификатор пользователя
                    example: 31231425
                required:
                  - userId
          application/xml:
            schema:
              xml:
                name: seanceUpdate
              allOf:
              - $ref: '#/components/schemas/seanceUpdate'
              - type: object
                properties:
                  userId:
                    type: integer
                    description: Идентификатор пользователя
                    example: 31231425
                required:
                  - userId
      responses:
        '200':
          description: Данные изменены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/seance'
            application/xml:
              schema:
                $ref: '#/components/schemas/seance'
        '400':
            description: Неверный формат запроса
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
              application/xml:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Сеанс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт - зал занят в указанное время
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /seances/{seanceId}/seats:
    get:
      tags:
        - Seances
      summary: Получить информацию о конкретном сеансе
      parameters:
        - in: path
          name: seanceId
          description: Идентификатор сеанса
          required: true
          schema:
            type: integer
            example: 12341243
        - in: query
          name: userId
          description: Идентификатор пользователя
          required: true
          schema:
            type: integer
            example: 31232131
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required:
                  - seance
                  - seats
                properties:
                  seance:
                    anyOf:
                      - $ref: '#/components/schemas/seance'
                      - $ref: '#/components/schemas/seanceAdmin'
                  seats:
                    description: Массив с объектами с данными по каждому месту в конкретном зале
                    type: array
                    items:
                      type: object
                      properties:
                        seatId:
                          description: Уникальный идентификатор места.
                          type: integer
                          example: 12312431224
                        seatNumber: 
                          description: Номер места в ряду.
                          type: integer
                          example: 21
                        rowNumber:
                          description: Номер ряда в зале.
                          type: integer
                          example: 6
                        seatType: 
                          description: Тип места.
                          type: string
                          enum:
                            - VIP
                            - LoveSeat
                        status: 
                          description: Статус места
                          type: string
                          enum:
                            - Available
                            - Reserved
                            - Booked
                        ticketPrice:
                          description: Цена за билет
                          type: number
                          example: 250.00
            application/xml:
              schema:
                xml:
                  name: seanceSingle
                type: object
                required:
                  - seance
                  - seats
                properties:
                  seance:
                    anyOf:
                      - $ref: '#/components/schemas/seance'
                      - $ref: '#/components/schemas/seanceAdmin'
                  seats:
                    description: Массив с объектами с данными по каждому месту в конкретном зале
                    type: array
                    items:
                      type: object
                      properties:
                        seatId:
                          description: Уникальный идентификатор места.
                          type: integer
                          example: 12312431224
                        seatNumber: 
                          description: Номер места в ряду.
                          type: integer
                          example: 21
                        rowNumber:
                          description: Номер ряда в зале.
                          type: integer
                          example: 6
                        seatType: 
                          description: Тип места.
                          type: string
                          enum:
                            - VIP
                            - LoveSeat
                        status: 
                          description: Статус места
                          type: string
                          enum:
                            - Available
                            - Reserved
                            - Booked
                        ticketPrice:
                          description: Цена за билет
                          type: number
                          example: 250.00
        '400':
          description: Неверный формат запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Сеанс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  
  /bookings/{bookingId}:
    get:
      tags:
        - Booking
      summary: Получить инфу о конкретной брони.
      parameters:
        - in: path
          name: bookingId
          description: Идентификатор бронирования
          required: true
          schema:
            type: integer
            example: 12321312
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/booking'
            application/xml:
              schema:
                $ref: '#/components/schemas/booking'
        '400':
          description: Неверный формат запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Бронь не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bookings:
    post:
      tags:
        - Booking
      summary: Создать бронь
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - seance
                - bookedSeats
              properties:
                userId:
                  description: Уникальный идентификатор пользователя. 
                  type: integer
                  example: 1243215
                seance:
                  $ref: '#/components/schemas/seance'
                bookedSeats:
                  type: array
                  items:
                    type: object
                    properties:
                      seat:
                        description: Объект с данными о месте
                        type: object
                        required:
                          - seatId
                          - rowNumber
                          - seatNumber
                        properties:
                          seatId:
                            description: Уникальный идентификатор места. Места должны относиться к залу выбранного сеанса и быть свободными. Не должно быть повторяющихся seatId.
                            type: integer
                            example: 2152634
                          rowNumber:
                            description: Номер ряда в зале.
                            type: integer
                            example: 3
                          seatNumber:
                            description: Номер места в зале.
                            type: integer
                            example: 21
                    required:
                      - userId
                      - seance
                      - bookedSeats
          application/xml:
            schema:
              xml:
                name: booking
              type: object
              required:
                - userId
                - seance
                - bookedSeats
              properties:
                userId:
                  description: Уникальный идентификатор пользователя. 
                  type: integer
                  example: 1243215
                seance:
                  $ref: '#/components/schemas/seance'
                bookedSeats:
                  type: array
                  items:
                    type: object
                    properties:
                      seat:
                        description: Объект с данными о месте
                        type: object
                        required:
                          - seatId
                          - rowNumber
                          - seatNumber
                        properties:
                          seatId:
                            description: Уникальный идентификатор места. Места должны относиться к залу выбранного сеанса и быть свободными. Не должно быть повторяющихся seatId.
                            type: integer
                            example: 2152634
                          rowNumber:
                            description: Номер ряда в зале.
                            type: integer
                            example: 3
                          seatNumber:
                            description: Номер места в зале.
                            type: integer
                            example: 21
      responses:
        '201':
          description: Бронь создана
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/booking'
            application/xml:
              schema:
                $ref: '#/components/schemas/booking'
        '400':
          description: Неверный формат запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Сеанс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт - одно или несколько мест заняты в указанное время
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bookings/{bookingId}/cancel:
    patch:
      tags:
        - Booking
      summary: Отменить бронь
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            description: Уникальный идентификатор брони.
            type: integer
            example: 53261753
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  description: Уникальный идентификатор пользователя. 
                  type: integer
                  example: 1243215
          application/xml:
            schema:
              xml:
                name: booking 
              type: object
              required:
                - userId
              properties:
                userId:
                  description: Уникальный идентификатор пользователя. 
                  type: integer
                  example: 1243215
      responses:
        '200':
          description: Бронь была отменена до оплаты.
          content:
            application/json:
              schema:
                type: object
                required:
                  - bookingId
                  - status
                properties:
                  bookingId:
                    description: Уникальный идентификатор брони.
                    type: integer
                    example: 53261753
                  status:
                    description: Статус брони
                    type: string
                    enum:
                      - Cancelled
            application/xml:
              schema:
                xml: 
                  name: booking 
                type: object
                required:
                  - bookingId
                  - status
                properties:
                  bookingId:
                    description: Уникальный идентификатор брони.
                    type: integer
                    example: 53261753
                  status:
                    description: Статус брони
                    type: string
                    enum:
                      - Cancelled
        '202':
          description: Бронь отменили после оплаты. Инициирован процесс возврата денег.
          content:
            application/json:
              schema: 
                type: object
                required:
                  - bookingId
                  - status
                properties:
                  bookingId:
                    description: Уникальный идентификатор брони.
                    type: integer
                    example: 53261753
                  status:
                    description: Статус брони
                    type: string
                    enum:
                      - RefundPending
            application/xml:
              schema: 
                xml:
                  name: booking 
                type: object
                required:
                  - bookingId
                  - status
                properties:
                  bookingId:
                    description: Уникальный идентификатор брони.
                    type: integer
                    example: 53261753
                  status:
                    description: Статус брони
                    type: string
                    enum:
                      - RefundPending
        '400':
          description: Неверный формат запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Бронь не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:
  securitySchemes:
    adminAuth:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: API-ключ администратора для доступа к защищенным эндпоинтам
  schemas:
    movie:
      description: Объект данных о фильме
      type: object
      properties:
        movieId:
          description: Идентификатор фильма
          type: integer
          example: 32167453
        movieName:
          description: Название фильма
          type: string
          example: "Interstellar"
        duration:
          description: Длительность фильма
          type: string
          example: "2 часа 49 минут"
        movieRating:
          description: Рейтинг фильма.
          type: string
          enum:
            - G
            - PG
            - PG-13
            - R
        posterLink:
          description: Ссылка на постер
          type: string
          format: uri
          example: "https://www.kinopoisk.ru/film/258687/?utm_referrer=www.google.com&socialAlias=NjIyOTI0MzM%3D"
    seancesResponse:
      description: Список сеансов с пагинацией
      type: object
      properties:
        count:
          type: integer
          description: Общее количество найденных сеансов
          minimum: 0
          example: 45
        next:
          type: string
          format: uri
          nullable: true
          description: Ссылка на следующую страницу
          example: https://api.example.com/seances?page=3&limit=10
        previous:
          type: string
          format: uri
          nullable: true
          description: Ссылка на предыдущую страницу
          example: https://api.example.com/seances?page=1&limit=10
        seances:
          type: array
          items:
            $ref: '#/components/schemas/seance'
      required:
        - count
        - next
        - previous
        - seances
    seance:
      description: Объект данных о сеансе
      type: object
      properties:
        seanceId:
          description: Идентификатор сеанса
          type: integer
          example: 1234672354
        movie:
          $ref: '#/components/schemas/movie'
        startDate:
          description: Дата начала сеанса
          type: string
          example: "2026-11-01"
        startTime:
          description: Время начала сеанса
          type: string
          example: "18:30"
        endDateTime:
          description: Дата и время окончания сеанса.
          type: string
          example: "21:19"
        auditoriumId:
          description: Уникальный идентификатор зала.
          type: integer
          example: 12361235
    seancesAdmin:
      description: Объект данных о сеансах
      type: object
      properties:
        count:
          type: integer
          description: Общее количество найденных сеансов
          minimum: 0
          example: 45
        next:
          type: string
          format: uri
          nullable: true
          description: Ссылка на следующую страницу
          example: https://api.example.com/seances?page=3&limit=10
        previous:
          type: string
          format: uri
          nullable: true
          description: Ссылка на предыдущую страницу
          example: https://api.example.com/seances?page=1&limit=10
        seances:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/seance'
              - type: object
                required:
                  - startDateMarkup
                  - startTimeMarkup
                properties:
                  startDateMarkup:
                    type: number
                    description: Наценка за дату сеанса
                  startTimeMarkup:
                    type: number
                    description: Наценка за время сеанса
      required:
        - count
        - next
        - previous
        - seances
    seanceAdmin:
      description: Объект данных о сеансе
      type: object
      allOf:
        - $ref: '#/components/schemas/seance'
        - type: object
          required:
            - startDateMarkup
            - startTimeMarkup
          properties:
            startDateMarkup:
              type: number
              description: Наценка за дату сеанса
            startTimeMarkup:
              type: number
              description: Наценка за время сеанса
    seanceUpdate:
      description: Объект данных о сеансе для функции изменения
      type: object
      properties:
        movie:
          $ref: '#/components/schemas/movie'
        startDate:
          description: Дата начала сеанса
          type: string
          example: "2026-11-01"
        startTime:
          description: Время начала сеанса
          type: string
          example: "18:30"
        endDateTime:
          description: Дата и время окончания сеанса.
          type: string
          example: "21:19"
        auditoriumId:
          description: Уникальный идентификатор зала.
          type: integer
          example: 12361235
        startDateMarkup:
          description: Наценка за дату сеанса.
          type: number
          example: 0.2
        startTimeMarkup:
          description: Наценка за время сеанса.
          type: number
          example: 0.2
    booking:
      description: данные брони
      type: object
      required:
        - bookingId
        - seance
        - bookingDate
        - status
        - totalPrice
        - expiresAt
        - bookedSeats
      properties:
        bookingId:
          description: Уникальный идентификатор брони. 
          type: integer
          example: 31234124
        seance:
          $ref: '#/components/schemas/seance'
        bookingDate:
          description: Дата создания брони
          type: string
          example: "2026-11-10 20:30:42"
        status:
          description: Статус брони
          type: string
          enum: 
            - Pending
            - Confirmed
            - Cancelled
            - RefundPending
            - Expired
        totalPrice:
          description: Общая стоимость бронирования 
          type: number
          example: 1000.00
        expiresAt: 
          description: Дата и время окончания срока действия неоплаченной брони.
          type: string
          example: "2026-11-30 23:59:59"
        bookedSeats:
          $ref: '#/components/schemas/bookedSeats'
    bookedSeats:
      description: Массив объектов с данными по забронированным местам.
      type: array
      items:
        type: object
        required:
          - seatId
          - rowNumber
          - seatNumber
          - ticketPrice
          - status
        properties:
          bookingSeatId: 
            description: Уникальный идентификатор места в брони.
            type: integer
            example: 2321412
          seatId:
            description: Уникальный идентификатор места в зале. 
            type: integer
            example: 34213421
          rowNumber:
            description: Номер ряда в зале.
            type: integer
            example: 3
          seatNumber:
            description: Номер места в зале.
            type: integer
            example: 21
          ticketPrice: 
            description: Цена за билет.
            type: number
            example: 250.00
          status:
            description: Статус места.
            type: string
            enum:
              - Reserved
              - Booked
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: Код ошибки HTTP
          example: 404
        message:
          type: string
          description: Сообщение об ошибке
          example: "Ресурс не найден"
tags:
  - name: Seances
    description: Операции с киносеансами
  - name: Booking
    description: Операции с бронью.